# new-money.42bucks.com — New Money University (Frappe Learning fork).
# Proxies to the new-money compose stack's frontend nginx on 127.0.0.1:8090,
# which serves built assets and routes /socket.io to the websocket service.
# Pre-cert: :80 only (ACME webroot + proxy). certbot --nginx adds the :443
# block + redirect. Install as /etc/nginx/sites-enabled/new-money.42bucks.com.
server {
    listen 80;
    server_name new-money.42bucks.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }
}
